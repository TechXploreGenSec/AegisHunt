name: build-harness-binary

# Builds the stamped working binary for this harness revision.
# Version identifier is pinned below AND in the release tag (v1.18.33-bb.*).
# The model/provider setup expects exactly OPENCODE_VERSION=1.18.33 —
# do not change the stamp without re-validating model access.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  OPENCODE_VERSION: "1.18.33"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build tools (native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install bun (pinned to repo packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck (all packages — fails the run on any type error)
        run: bun typecheck

      - name: Build stamped binary
        run: bun run --cwd packages/opencode build --single --skip-embed-web-ui

      - name: Smoke test
        run: ./packages/opencode/dist/opencode-linux-x64/bin/opencode --version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-1.18.33-linux-x64
          path: packages/opencode/dist/opencode-linux-x64/bin/opencode
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencode-1.18.33-linux-x64
          path: ./release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/opencode
          body: |
            AegisHunt harness binary — stamped `OPENCODE_VERSION=1.18.33`.
            Linux x64. Run through an env-loading wrapper (see README).
