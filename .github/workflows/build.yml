name: build-harness-binary

# Builds the stamped working binary for this harness revision.
# Version identifier is pinned below AND in the release tag (v1.18.33-bb.*).
# The model/provider setup expects exactly OPENCODE_VERSION=1.18.33 —
# do not change the stamp without re-validating model access.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  OPENCODE_VERSION: "1.18.33"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build tools (native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install bun (pinned to repo packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck harness package (fails the run on any type error)
        # Scoped to packages/opencode (where all harness code lives):
        # full-turbo typecheck OOMs the free runner (exit 137) checking
        # 36 untouched upstream packages, so it proves nothing extra.
        run: bun run --cwd packages/opencode typecheck

      - name: Build stamped binary
        run: bun run --cwd packages/opencode build --single --skip-embed-web-ui

      - name: Smoke test
        run: ./packages/opencode/dist/opencode-linux-x64/bin/opencode --version

      - name: Verify harness tools bundled
        # Grep proves every enforcement tool survived bundling — a dropped
        # registry import would otherwise ship a silent, half-working binary.
        run: |
          BIN=./packages/opencode/dist/opencode-linux-x64/bin/opencode
          for marker in tool_call_audit_get todo_coverage_check todo_honesty_check endpoint_completion_score asset_generate_test_plan hypothesis_coverage_check harness_self_check bot_notify_hold watchdog-resume withTargetGuard scope_deviations; do
            grep -q "$marker" "$BIN" || { echo "MISSING from binary: $marker"; exit 1; }
          done
          echo "all harness markers present"

      - name: Pack harness bundle (scripts, docs, version)
        run: |
          mkdir -p ./release
          cp ./packages/opencode/dist/opencode-linux-x64/bin/opencode ./release/opencode
          tar -czf ./release/harness-bundle.tar.gz harness VERSION README.md

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-1.18.33-linux-x64
          path: ./release/opencode
          if-no-files-found: error

      - name: Upload harness bundle
        uses: actions/upload-artifact@v4
        with:
          name: harness-bundle
          path: ./release/harness-bundle.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencode-1.18.33-linux-x64
          path: ./release

      - uses: actions/download-artifact@v4
        with:
          name: harness-bundle
          path: ./release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/opencode
            ./release/harness-bundle.tar.gz
          body: |
            AegisHunt harness binary — stamped `OPENCODE_VERSION=1.18.33`.
            Linux x64. Download BOTH assets: `opencode` + `harness-bundle.tar.gz`
            (run.sh, fetch-methodology.sh, session_watchdog.sh, install.sh,
            agents, skills, scopes, sanitized config). Launch via run.sh —
            it preflights env, config, version before starting.
